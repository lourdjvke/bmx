<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thread & Co - Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
          colors: { brand: { dark: '#11111a', accent: '#7c3aed' } }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
    h1, h2, .brand-font { font-family: 'Playfair Display', serif; }
    
    .cart-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .cart-overlay.active { opacity: 1; pointer-events: auto; }
    
    .cart-panel { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .cart-panel.active { transform: translateX(0); }

    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

  <!-- Navbar -->
  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-shirt text-brand-accent text-xl"></i>
        <span class="text-xl font-bold brand-font tracking-wide">Thread & Co.</span>
      </div>
      
      <button onclick="toggleCart()" class="relative p-2 text-gray-600 hover:text-brand-accent transition">
        <i class="fa-solid fa-bag-shopping text-xl"></i>
        <span id="cart-badge" class="absolute top-0 right-0 bg-brand-accent text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center opacity-0 transition-opacity">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-brand-dark text-white py-16 md:py-24 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
      <h1 class="text-4xl md:text-6xl mb-4 leading-tight">Elevate Your Everyday</h1>
      <p class="text-gray-400 max-w-xl mx-auto text-sm md:text-base mb-8">Discover our curated collection of premium essentials. Minimalist design, maximum comfort.</p>
    </div>
  </section>

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
    <div class="flex justify-between items-end mb-8 border-b border-gray-200 pb-4">
      <h2 class="text-2xl font-semibold">Latest Arrivals</h2>
      <div id="loading-indicator" class="text-brand-accent text-sm font-medium"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading catalogue...</div>
    </div>
    
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-10">
      <!-- Products injected via JS -->
    </div>
  </main>

  <footer class="bg-white border-t border-gray-100 py-8 text-center text-sm text-gray-500">
    <p>&copy; 2026 Thread & Co. Powered by Visage GitDB.</p>
  </footer>

  <div id="cart-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 cart-overlay" onclick="toggleCart()"></div>
  
  <div id="cart-panel" class="fixed inset-y-0 right-0 w-full md:w-[400px] bg-white z-50 cart-panel flex flex-col shadow-2xl">
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white">
      <h3 class="font-bold text-lg brand-font">Your Shopping Bag</h3>
      <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-800 transition"><i class="fa-solid fa-times text-xl"></i></button>
    </div>
    
    <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6">
      <!-- Cart items injected here -->
      <div class="h-full flex flex-col items-center justify-center text-gray-400">
        <i class="fa-solid fa-bag-shopping text-4xl mb-3 opacity-20"></i>
        <p>Your bag is empty.</p>
      </div>
    </div>

    <!-- Checkout Form (Hidden by default, shown when checking out) -->
    <div id="checkout-form-container" class="hidden flex-1 overflow-y-auto p-6 bg-gray-50 border-t border-gray-100">
      <h4 class="font-semibold text-gray-800 mb-4">Shipping Details</h4>
      <form id="checkout-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Full Name</label>
          <input type="text" id="c-name" required class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-accent/20 outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Email (For order updates)</label>
          <input type="email" id="c-email" required class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-accent/20 outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Shipping Address</label>
          <textarea id="c-address" required rows="2" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-accent/20 outline-none transition resize-none"></textarea>
        </div>
      </form>
    </div>
    
    <div class="border-t border-gray-100 p-6 bg-white shrink-0">
      <div class="flex justify-between items-center mb-4">
        <span class="text-gray-500 font-medium text-sm">Subtotal</span>
        <span id="cart-total" class="font-bold text-lg text-brand-dark">$0.00</span>
      </div>
      <button id="checkout-btn" onclick="proceedToCheckout()" disabled class="w-full bg-brand-dark text-white font-medium py-3.5 rounded-xl hover:bg-gray-800 transition disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center">
        <span id="checkout-btn-text">Checkout</span>
        <i id="checkout-btn-spin" class="fa-solid fa-circle-notch fa-spin ml-2 hidden"></i>
      </button>
      <button id="back-to-cart-btn" onclick="backToCart()" class="hidden w-full text-center text-sm text-gray-500 hover:text-gray-800 font-medium mt-3">Back to Cart</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://storage.breacher.name.ng/sdk.js";

    const config = { workerUrl: "https://storage.breacher.name.ng", uid: "wiCdOyoCFGPeVrMsbmgXAV0wAm12", repo: "app-db" };
    const app = initializeApp(config);

    let products = [];
    let cart = [];
    let isCheckingOut = false;

    // DOM
    const productGrid = document.getElementById('product-grid');
    const loader = document.getElementById('loading-indicator');
    const overlay = document.getElementById('cart-overlay');
    const panel = document.getElementById('cart-panel');
    const cartItemsContainer = document.getElementById('cart-items');
    const cartBadge = document.getElementById('cart-badge');
    const cartTotalEl = document.getElementById('cart-total');
    
    // Checkout Elements
    const checkoutContainer = document.getElementById('checkout-form-container');
    const checkoutBtn = document.getElementById('checkout-btn');
    const checkoutBtnText = document.getElementById('checkout-btn-text');
    const backBtn = document.getElementById('back-to-cart-btn');

    // Functions exposed globally
    window.toggleCart = () => {
      overlay.classList.toggle('active');
      panel.classList.toggle('active');
      if(isCheckingOut) window.backToCart();
    };

    window.addToCart = (id) => {
      const product = products.find(p => p._id === id);
      if (!product) return;
      
      const existing = cart.find(item => item._id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      
      updateCartUI();
      // Auto open cart
      overlay.classList.add('active');
      panel.classList.add('active');
    };

    window.removeFromCart = (id) => {
      cart = cart.filter(item => item._id !== id);
      updateCartUI();
    };

    window.updateQty = (id, delta) => {
      const item = cart.find(i => i._id === id);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) window.removeFromCart(id);
        else updateCartUI();
      }
    };

    window.proceedToCheckout = async () => {
      if (!isCheckingOut) {
        // Switch view to form
        isCheckingOut = true;
        cartItemsContainer.classList.add('hidden');
        checkoutContainer.classList.remove('hidden');
        checkoutBtnText.textContent = "Place Order & Pay";
        backBtn.classList.remove('hidden');
        return;
      }

      // Actually place order
      const form = document.getElementById('checkout-form');
      if(!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      checkoutBtn.disabled = true;
      document.getElementById('checkout-btn-spin').classList.remove('hidden');
      checkoutBtnText.textContent = "Processing...";

      try {
        const orderId = `ord_${Date.now()}`;
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        
        const orderData = {
          customerName: document.getElementById('c-name').value,
          customerEmail: document.getElementById('c-email').value,
          address: document.getElementById('c-address').value,
          status: 'New',
          cart: cart.map(item => ({ id: item._id, name: item.name, price: item.price, quantity: item.quantity, imagePath: item.imagePath })),
          total: total
        };

        await app.set(`orders/${orderId}`, orderData);
        
        alert("Order placed successfully!");
        cart = []; // Empty cart
        updateCartUI();
        window.toggleCart(); // Close
        form.reset();
        
      } catch (err) {
        alert("Failed to place order: " + err.message);
      } finally {
        checkoutBtn.disabled = false;
        document.getElementById('checkout-btn-spin').classList.add('hidden');
        window.backToCart(); // reset view
      }
    };

    window.backToCart = () => {
      isCheckingOut = false;
      cartItemsContainer.classList.remove('hidden');
      checkoutContainer.classList.add('hidden');
      checkoutBtnText.textContent = "Checkout";
      backBtn.classList.add('hidden');
    };

    function updateCartUI() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalCost = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      
      // Update Badge
      cartBadge.textContent = totalItems;
      if(totalItems > 0) cartBadge.classList.remove('opacity-0');
      else cartBadge.classList.add('opacity-0');
      
      cartTotalEl.textContent = `$${totalCost.toFixed(2)}`;
      checkoutBtn.disabled = cart.length === 0;

      // Render Items
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-gray-400">
            <i class="fa-solid fa-bag-shopping text-4xl mb-3 opacity-20"></i>
            <p>Your bag is empty.</p>
          </div>`;
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="flex gap-4 fade-in">
          <div class="w-20 h-24 bg-gray-50 rounded-lg overflow-hidden shrink-0 border border-gray-100">
            <img src="${item.imagePath ? app.getMediaUrl(item.imagePath) : 'https://placehold.co/100x120/f3f4f6/a1a1aa?text=Img'}" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 flex flex-col">
            <div class="flex justify-between items-start">
              <h5 class="font-semibold text-sm text-gray-800 leading-tight">${item.name}</h5>
              <button onclick="removeFromCart('${item._id}')" class="text-gray-400 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
            <p class="text-brand-dark font-bold mt-1 text-sm">$${item.price.toFixed(2)}</p>
            
            <div class="mt-auto flex items-center border border-gray-200 w-max rounded-md overflow-hidden bg-white">
              <button onclick="updateQty('${item._id}', -1)" class="w-7 h-7 flex items-center justify-center text-gray-500 hover:bg-gray-50 transition">-</button>
              <span class="w-8 text-center text-xs font-semibold">${item.quantity}</span>
              <button onclick="updateQty('${item._id}', 1)" class="w-7 h-7 flex items-center justify-center text-gray-500 hover:bg-gray-50 transition">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function loadProducts() {
      try {
        const res = await app.list("products", { sort: "createdAt:desc", _: Date.now() });
        products = (res.documents || []).filter(p => p._id !== '.keep');
        
        loader.classList.add('hidden');
        
        if(products.length === 0) {
          productGrid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500">No products available at the moment.</div>`;
          return;
        }

        productGrid.innerHTML = products.map((item, i) => `
          <div class="group fade-in" style="animation-delay: ${i*0.1}s">
            <div class="w-full aspect-[4/5] bg-gray-100 rounded-2xl overflow-hidden mb-4 relative">
              <img src="${item.imagePath ? app.getMediaUrl(item.imagePath) : 'https://placehold.co/400x500/f3f4f6/a1a1aa?text=Image'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <button onclick="addToCart('${item._id}')" class="absolute bottom-4 left-4 right-4 bg-white/95 backdrop-blur text-brand-dark font-semibold py-2.5 rounded-xl opacity-0 translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 shadow-lg text-sm hover:bg-brand-dark hover:text-white">
                Add to Bag
              </button>
            </div>
            <div>
              <h3 class="font-medium text-gray-900 leading-tight">${item.name}</h3>
              <p class="text-sm text-gray-500 mt-1 font-semibold">$${parseFloat(item.price).toFixed(2)}</p>
            </div>
          </div>
        `).join('');

      } catch(err) {
        loader.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Failed to load catalog</span>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
