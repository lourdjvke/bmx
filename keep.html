<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitDB Notes App</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: { 500: '#6366f1', 600: '#4f46e5' } }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-lg bg-brand-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-brand-500/30">
          <i class="fa-solid fa-book-journal-whills"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight leading-none">GitDB Notes</h1>
          <p class="text-xs text-slate-400 mt-1">Powered by Visage API & Media Proxy</p>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <button id="init-repo-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded-lg border border-slate-700 transition flex items-center">
          <i class="fa-brands fa-github mr-2"></i> Init Repo
        </button>
        <div id="connection-status" class="flex items-center text-xs font-medium text-amber-400 bg-amber-400/10 px-3 py-1.5 rounded-full border border-amber-400/20">
          <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Ready to connect
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8 w-full flex-1 grid grid-cols-1 md:grid-cols-12 gap-8">
    
    <!-- Left Column: Post a Note Form -->
    <div class="md:col-span-4 space-y-6 relative">
      <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-2xl sticky top-24">
        <h2 class="text-lg font-semibold mb-4 flex items-center">
          <i class="fa-solid fa-pen-to-square text-brand-500 mr-2"></i> Write a Note
        </h2>
        
        <form id="note-form" class="space-y-4">
          <div>
            <label for="note-title" class="block text-xs font-medium text-slate-400 mb-1">Title</label>
            <input type="text" id="note-title" required placeholder="e.g. Design Blueprint" 
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition placeholder:text-slate-600">
          </div>
          <div>
            <label for="note-body" class="block text-xs font-medium text-slate-400 mb-1">Content</label>
            <textarea id="note-body" required rows="4" placeholder="Write your thoughts here..." 
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition placeholder:text-slate-600 resize-none"></textarea>
          </div>

          <!-- Image Attachment Input -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Attach Image (Optional)</label>
            <div class="flex items-center space-x-2">
              <label for="note-image" class="cursor-pointer flex-1 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 rounded-lg px-3 py-2 text-xs transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-image text-brand-500"></i>
                <span id="image-label">Choose Image</span>
              </label>
              <input type="file" id="note-image" accept="image/*" class="hidden">
            </div>

            <!-- Thumbnail Preview -->
            <div id="image-preview-container" class="relative mt-3 hidden">
              <img id="image-preview" class="w-full h-32 object-cover rounded-lg border border-slate-700" alt="Selected Preview">
              <button type="button" id="remove-image-btn" class="absolute top-2 right-2 bg-slate-950/80 hover:bg-red-600 text-white rounded-full h-6 w-6 flex items-center justify-center text-xs transition">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" id="submit-btn" disabled
            class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center">
            <span id="btn-text">Post Note</span>
            <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin ml-2 hidden"></i>
          </button>

          <p id="form-error" class="text-red-400 text-xs hidden mt-2"></p>
        </form>

        <!-- Mail Test Section -->
        <div class="mt-6 pt-6 border-t border-slate-700/60">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
            <i class="fa-solid fa-paper-plane text-brand-500 mr-2"></i> Quick Mail Test
          </h3>
          <form id="mail-form" class="space-y-3">
            <input type="email" id="mail-to" required placeholder="Recipient Email"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 transition">
            <input type="text" id="mail-alias-email" placeholder="Custom Alias Email (Optional)"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 transition">
            <input type="text" id="mail-alias-name" placeholder="Display Name (Optional)"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 transition">
            <button type="submit" id="mail-btn"
              class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium py-2 rounded-lg transition flex items-center justify-center">
              <i class="fa-solid fa-envelope mr-1.5"></i> Send Test Mail
            </button>
          </form>
        </div>

      </div>
    </div>

    <!-- Right Column: Notes Feed -->
    <div class="md:col-span-8 space-y-4">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-semibold">Your Notes</h2>
        <button id="refresh-btn" class="text-slate-400 hover:text-white transition text-sm flex items-center disabled:opacity-50" title="Refresh Notes">
          <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
        </button>
      </div>

      <div id="notes-container" class="space-y-4">
        <!-- Notes will be injected here via JS -->
        <div class="animate-pulse bg-slate-800/30 border border-slate-700/50 p-5 rounded-xl">
          <div class="h-5 bg-slate-700 rounded w-1/3 mb-3"></div>
          <div class="h-4 bg-slate-700/50 rounded w-full mb-2"></div>
          <div class="h-4 bg-slate-700/50 rounded w-4/5"></div>
        </div>
      </div>
      
      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center py-16 bg-slate-800/20 border border-slate-800 border-dashed rounded-2xl">
        <div class="h-16 w-16 bg-slate-800 text-slate-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
          <i class="fa-solid fa-inbox"></i>
        </div>
        <h3 class="text-lg font-medium text-slate-300">No notes found</h3>
        <p class="text-sm text-slate-500 mt-1">Be the first to post a note using the form.</p>
      </div>
    </div>

  </main>

  <script type="module">
    // Import dynamically directly from your deployed worker
    import { initializeApp } from "https://storage.breacher.name.ng/sdk.js";

    // Application Config
    const config = {
      workerUrl: "https://storage.breacher.name.ng",
      uid: "wiCdOyoCFGPeVrMsbmgXAV0wAm12",
      repo: "app-db" 
    };

    // Initialize SDK
    const app = initializeApp(config);

    // DOM Elements
    const connectionStatus = document.getElementById('connection-status');
    const noteForm = document.getElementById('note-form');
    const titleInput = document.getElementById('note-title');
    const bodyInput = document.getElementById('note-body');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const formError = document.getElementById('form-error');
    const notesContainer = document.getElementById('notes-container');
    const emptyState = document.getElementById('empty-state');
    const refreshBtn = document.getElementById('refresh-btn');
    const initRepoBtn = document.getElementById('init-repo-btn');

    // Image Input Elements
    const imageInput = document.getElementById('note-image');
    const imageLabel = document.getElementById('image-label');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const removeImageBtn = document.getElementById('remove-image-btn');

    // Mail Elements
    const mailForm = document.getElementById('mail-form');
    const mailTo = document.getElementById('mail-to');
    const mailAliasEmail = document.getElementById('mail-alias-email');
    const mailAliasName = document.getElementById('mail-alias-name');
    const mailBtn = document.getElementById('mail-btn');

    // State
    let isAppReady = false;
    let selectedImageFile = null;

    // --- IMAGE HANDLING ---
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 10 * 1024 * 1024) {
          alert('Image size exceeds 10MB limit.');
          imageInput.value = '';
          return;
        }
        selectedImageFile = file;
        imageLabel.textContent = file.name.length > 18 ? file.name.substring(0, 15) + '...' : file.name;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          imagePreview.src = event.target.result;
          imagePreviewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    removeImageBtn.addEventListener('click', () => {
      clearImageSelection();
    });

    function clearImageSelection() {
      selectedImageFile = null;
      imageInput.value = '';
      imageLabel.textContent = 'Choose Image';
      imagePreview.src = '';
      imagePreviewContainer.classList.add('hidden');
    }

    // --- HELPER FUNCTIONS ---

    function setStatus(status, type = 'loading') {
      connectionStatus.innerHTML = '';
      
      if (type === 'loading') {
        connectionStatus.className = "flex items-center text-xs font-medium text-amber-400 bg-amber-400/10 px-3 py-1.5 rounded-full border border-amber-400/20";
        connectionStatus.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> ${status}`;
      } else if (type === 'success') {
        connectionStatus.className = "flex items-center text-xs font-medium text-emerald-400 bg-emerald-400/10 px-3 py-1.5 rounded-full border border-emerald-400/20";
        connectionStatus.innerHTML = `<i class="fa-solid fa-check mr-2"></i> ${status}`;
        setTimeout(() => { connectionStatus.style.opacity = '0.5'; }, 3000);
      } else if (type === 'error') {
        connectionStatus.className = "flex items-center text-xs font-medium text-red-400 bg-red-400/10 px-3 py-1.5 rounded-full border border-red-400/20";
        connectionStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${status}`;
      }
    }

    function toggleFormState(isLoading, statusMsg = "Saving...") {
      submitBtn.disabled = isLoading || !isAppReady;
      titleInput.disabled = isLoading;
      bodyInput.disabled = isLoading;
      imageInput.disabled = isLoading;
      
      if (isLoading) {
        btnText.textContent = statusMsg;
        btnSpinner.classList.remove('hidden');
      } else {
        btnText.textContent = "Post Note";
        btnSpinner.classList.add('hidden');
      }
    }

    function formatDate(isoString) {
      if (!isoString) return 'Just now';
      const date = new Date(isoString);
      return new Intl.DateTimeFormat('en-US', { 
        month: 'short', day: 'numeric', hour: 'numeric', minute: 'numeric' 
      }).format(date);
    }

    // --- MAIN LOGIC ---

    async function handleInitRepo() {
      const originalText = initRepoBtn.innerHTML;
      initRepoBtn.disabled = true;
      initRepoBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Initializing...';
      
      try {
        setStatus('Creating Repository...');
        const initRes = await app.initRepo();
        
        if (initRes.success || initRes.message === "Repository already exists.") {
           setStatus('Repo Ready!', 'success');
           alert(initRes.message + (initRes.repo ? ` (${initRes.repo})` : ''));
        } else {
           setStatus('Init Failed', 'error');
           alert("Failed to initialize: " + (initRes.error || JSON.stringify(initRes)));
        }
      } catch (err) {
        setStatus('Init Error', 'error');
        alert("Error initializing repo: " + err.message);
      } finally {
        initRepoBtn.disabled = false;
        initRepoBtn.innerHTML = originalText;
      }
    }

    async function bootApp() {
      try {
        setStatus('Fetching Notes...');
        await loadNotes();

        isAppReady = true;
        submitBtn.disabled = false;
        setStatus('Connected', 'success');
      } catch (err) {
        console.error("Boot Error:", err);
        setStatus('Connection Failed', 'error');
        notesContainer.innerHTML = `<div class="text-red-400 bg-red-900/20 border border-red-900 p-4 rounded-lg text-sm">Failed to connect to database: ${err.message}</div>`;
      }
    }

    async function loadNotes() {
      refreshBtn.disabled = true;
      refreshBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Refreshing';
      
      try {
        // Appending timestamp to instantly bust Cloudflare Cache on every load
        const res = await app.list("notes", { sort: "createdAt:desc", _: Date.now() });
        renderNotes(res.documents || []);
      } catch (err) {
        if (err.message.includes("Path not found")) {
          renderNotes([]);
        } else {
          console.error("Feed Error:", err);
          notesContainer.innerHTML = `<div class="text-red-400 bg-red-900/20 border border-red-900 p-4 rounded-lg text-sm">Failed to load notes: ${err.message}</div>`;
        }
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<i class="fa-solid fa-rotate-right mr-1"></i> Refresh';
      }
    }

    function renderNotes(notes) {
      notesContainer.innerHTML = '';
      
      if (!notes || notes.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      
      emptyState.classList.add('hidden');

      notes.forEach(note => {
        if (note._id === '.keep') return;

        const el = document.createElement('div');
        el.className = 'bg-slate-800 border border-slate-700 p-5 rounded-xl hover:border-slate-600 transition shadow-sm space-y-3';
        
        const safeTitle = note.title ? note.title.replace(/</g, "&lt;").replace(/>/g, "&gt;") : 'Untitled';
        const safeBody = note.body ? note.body.replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        
        let mediaHtml = '';
        if (note.imagePath) {
          const mediaUrl = app.getMediaUrl(note.imagePath);
          mediaHtml = `
            <div class="rounded-lg overflow-hidden border border-slate-700/80 bg-slate-900/60 group relative">
              <a href="${mediaUrl}" target="_blank" title="Click to view original">
                <img src="${mediaUrl}" alt="${safeTitle}" 
                  class="w-full max-h-80 object-cover group-hover:scale-[1.01] transition duration-200"
                  loading="lazy" 
                  onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'p-4 text-xs text-slate-500 italic flex items-center\\'><i class=\\'fa-solid fa-triangle-exclamation mr-2 text-amber-500\\'></i> Image unavailable or deleted</div>';" />
              </a>
            </div>
          `;
        }

        el.innerHTML = `
          <div class="flex justify-between items-start">
            <h3 class="font-semibold text-lg text-white leading-tight">${safeTitle}</h3>
            <span class="text-xs text-slate-500 whitespace-nowrap ml-4 flex-shrink-0">
              <i class="fa-regular fa-clock mr-1"></i> ${formatDate(note.createdAt)}
            </span>
          </div>
          <p class="text-slate-300 text-sm whitespace-pre-wrap leading-relaxed">${safeBody}</p>
          ${mediaHtml}
        `;
        notesContainer.appendChild(el);
      });
    }

    // --- MAIL TEST LOGIC ---
    mailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const origText = mailBtn.innerHTML;
      mailBtn.disabled = true;
      mailBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Sending...';

      try {
        const res = await app.sendMail({
          to: mailTo.value.trim(),
          from: mailAliasEmail.value.trim() || undefined,
          aliasName: mailAliasName.value.trim() || undefined,
          subject: "Test Email from Visage Worker",
          html: "<h3>Visage Mail Engine Test</h3><p>This email was sent using native Cloudflare Worker TCP sockets via Google SMTP!</p>"
        });
        alert("Email sent successfully!");
      } catch (err) {
        alert("Error sending email: " + err.message);
      } finally {
        mailBtn.disabled = false;
        mailBtn.innerHTML = origText;
      }
    });

    // --- EVENT LISTENERS ---

    noteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.classList.add('hidden');
      
      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      if (!title || !body) return;

      let uploadedImagePath = null;

      try {
        if (selectedImageFile) {
          toggleFormState(true, "Uploading Media...");
          setStatus('Uploading Image...');
          
          const cleanFileName = selectedImageFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          uploadedImagePath = `uploads/${Date.now()}_${cleanFileName}`;
          
          await app.uploadMedia(uploadedImagePath, selectedImageFile);
        }

        toggleFormState(true, "Saving Note...");
        setStatus('Saving Note...');
        
        const noteId = `note_${Date.now()}`;
        const notePayload = { title, body };
        if (uploadedImagePath) notePayload.imagePath = uploadedImagePath;

        await app.set(`notes/${noteId}`, notePayload);

        titleInput.value = '';
        bodyInput.value = '';
        clearImageSelection();
        
        setStatus('Note Saved!', 'success');
        await loadNotes();

      } catch (err) {
        console.error("Save Error:", err);
        formError.textContent = "Failed to save note: " + err.message;
        formError.classList.remove('hidden');
        setStatus('Save Failed', 'error');
      } finally {
        toggleFormState(false);
      }
    });

    refreshBtn.addEventListener('click', loadNotes);
    initRepoBtn.addEventListener('click', handleInitRepo);
    window.addEventListener('DOMContentLoaded', bootApp);

  </script>
</body>
</html>
